---
java_package: openjdk-21-jre-headless
timezone: Asia/Ho_Chi_Minh

# Current active Jenkins signing key (see apt error NO_PUBKEY 7198F4B714ABFC68).
# We fetch it by fingerprint from Ubuntu keyserver, not from pkg.jenkins.io's
# year-tagged URL that rotates and can point at an expired key.
jenkins_signing_key_fingerprint: "7198F4B714ABFC68"
jenkins_signing_key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ jenkins_signing_key_fingerprint }}&options=mr"
jenkins_repo_uri: https://pkg.jenkins.io/debian-stable
jenkins_repo_suites: binary/

docker_signing_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_repo_uri: https://download.docker.com/linux/ubuntu

awscli_zip_url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip

# Trivy - pin apt package version
trivy_version: "0.71.2"
trivy_signing_key_url: https://aquasecurity.github.io/trivy-repo/deb/public.key
trivy_repo_uri: https://aquasecurity.github.io/trivy-repo/deb

# TruffleHog - binary release from GitHub; checksum verified from the same release
trufflehog_version: "3.90.5"
trufflehog_release_base: "https://github.com/trufflesecurity/trufflehog/releases/download"

# kubectl - keep in the same minor as the EKS control plane (see
# infra/stacks/eks/variables.tf cluster_version). Skew of +/- 1 minor is
# supported by K8s; keeping them equal avoids surprises.
kubectl_version: "1.31.4"
kubectl_release_base: "https://dl.k8s.io/release"
