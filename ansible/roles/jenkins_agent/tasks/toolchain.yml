---
# --- Maven ---------------------------------------------------------------
- name: Install Maven
  ansible.builtin.apt:
    name: maven
    state: present

# --- Docker --------------------------------------------------------------
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker signing key
  ansible.builtin.get_url:
    url: "{{ docker_signing_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_repo_uri }}"
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    enabled: true

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
    state: present
    update_cache: true

- name: Configure Docker daemon log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    owner: root
    group: root
    mode: '0644'
  notify: Restart docker

- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add jenkins user to docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true

# --- AWS CLI v2 ----------------------------------------------------------
- name: Download AWS CLI v2 installer
  ansible.builtin.get_url:
    url: "{{ awscli_zip_url }}"
    dest: /tmp/awscliv2.zip
    mode: '0644'
  register: awscli_zip

- name: Extract AWS CLI v2 installer
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp/
    remote_src: true
  when: awscli_zip.changed

- name: Install AWS CLI v2 (idempotent via creates)
  ansible.builtin.command: /tmp/aws/install
  args:
    creates: /usr/local/bin/aws

# --- Trivy ---------------------------------------------------------------
- name: Download Trivy signing key
  ansible.builtin.get_url:
    url: "{{ trivy_signing_key_url }}"
    dest: /etc/apt/keyrings/trivy.asc
    owner: root
    group: root
    mode: '0644'

- name: Add Trivy apt repository
  ansible.builtin.deb822_repository:
    name: trivy
    types: deb
    uris: "{{ trivy_repo_uri }}"
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: /etc/apt/keyrings/trivy.asc
    enabled: true

- name: Install Trivy (pinned)
  ansible.builtin.apt:
    name: "trivy={{ trivy_version }}"
    state: present
    update_cache: true
    allow_downgrade: true

# --- TruffleHog ---------------------------------------------------------
# Binary release with checksum verified from the same GitHub release.
- name: Download TruffleHog release archive (checksum verified)
  ansible.builtin.get_url:
    url: "{{ trufflehog_release_base }}/v{{ trufflehog_version }}/trufflehog_{{ trufflehog_version }}_linux_amd64.tar.gz"
    dest: "/tmp/trufflehog_{{ trufflehog_version }}.tar.gz"
    checksum: "sha256:{{ trufflehog_release_base }}/v{{ trufflehog_version }}/trufflehog_{{ trufflehog_version }}_checksums.txt"
    mode: '0644'

- name: Install TruffleHog binary
  ansible.builtin.unarchive:
    src: "/tmp/trufflehog_{{ trufflehog_version }}.tar.gz"
    dest: /usr/local/bin
    include:
      - trufflehog
    owner: root
    group: root
    mode: '0755'
    remote_src: true
    creates: /usr/local/bin/trufflehog

- name: Verify TruffleHog version matches pin
  ansible.builtin.command: /usr/local/bin/trufflehog --version
  register: trufflehog_version_check
  changed_when: false
  failed_when: trufflehog_version not in trufflehog_version_check.stderr + trufflehog_version_check.stdout
